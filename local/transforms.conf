[threat_indicator_value]
REGEX = "\"value\"\s*:\s*\"(?P<indicator_value>[^\"]+)\""
FORMAT = indicator_value::$1
WRITE_META = true

[threat_indicator_type]
REGEX = "\"indicator_type\"\s*:\s*\"(?P<indicator_type>[^\"]+)\""
FORMAT = indicator_type::$1
WRITE_META = true

[threat_indicator_source]
REGEX = "\"source\"\s*:\s*\"(?P<indicator_source>[^\"]+)\""
FORMAT = indicator_source::$1
WRITE_META = true

[threat_indicator_confidence]
REGEX = "\"confidence\"\s*:\s*(?P<indicator_confidence>\d+)"
FORMAT = indicator_confidence::$1
WRITE_META = true

[threat_indicator_first_seen]
REGEX = "\"first_seen\"\s*:\s*\"(?P<indicator_first_seen>[^\"]+)\""
FORMAT = indicator_first_seen::$1
WRITE_META = true

[threat_indicator_last_seen]
REGEX = "\"last_seen\"\s*:\s*(?:null|\"(?P<indicator_last_seen>[^\"]+)\")"
FORMAT = indicator_last_seen::$1
WRITE_META = true